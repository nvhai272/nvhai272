name: Recent commits

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X GET search/commits \
            -f q="author:${{ github.repository_owner }}" \
            -f sort=author-date -f order=desc -f per_page=5 \
            --jq '.items[] | "- `\(.commit.author.date[:10])` [\(.commit.message | split("\n")[0])](\(.html_url)) in **\(.repository.full_name)**"' > activity.md
          python3 - <<'EOF'
          import re
          readme = open('README.md', encoding='utf-8').read()
          items = open('activity.md', encoding='utf-8').read().strip()
          pattern = r'(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)'
          new = re.sub(pattern, lambda m: m.group(1) + '\n' + items + '\n' + m.group(2), readme, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(new)
          EOF
          rm activity.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update recent commits" && git push)
